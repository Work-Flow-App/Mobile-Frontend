name: Development Build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  # Job 1: Run tests and code analysis
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dummy Test
        run: |
          echo "Running a dummy test for 1 second..."
          sleep 1
          echo "Test passed!"

  # Job 2: Build the Android APK
  build_apk:
    name: Build Dev APK
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter pub get
      - name: Create .env.dev file
        run: |
          mkdir -p env
          echo 'BASE_URL=${{ secrets.DEV_BASE_URL }}' >> env/.env.dev
          echo 'SOME_API_KEY=${{ secrets.DEV_SOME_API_KEY }}' >> env/.env.dev
          echo 'GOOGLE_MAPS_API_KEY=${{ secrets.DEV_GOOGLE_MAPS_API_KEY }}' >> env/.env.dev
      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=env/.env.dev
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: development-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Job 3: Build the iOS App (Unsigned for Dev)
  build_ios:
    name: Build Dev iOS
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Create .env.dev file
        run: |
          mkdir -p env
          echo 'BASE_URL=${{ secrets.DEV_BASE_URL }}' >> env/.env.dev
          echo 'SOME_API_KEY=${{ secrets.DEV_SOME_API_KEY }}' >> env/.env.dev
          echo 'GOOGLE_MAPS_API_KEY=${{ secrets.DEV_GOOGLE_MAPS_API_KEY }}' >> env/.env.dev

      - name: Build iOS App (No Codesign)
        # This compiles the ARM64 binary required for real devices
        run: flutter build ios --release --no-codesign --dart-define-from-file=env/.env.dev

      - name: Package Unsigned IPA for BrowserStack
        # BrowserStack accepts an unsigned .app as long as it is packaged in a Payload folder and zipped as an .ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -qr dev-app.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: development-ios
          path: build/ios/iphoneos/dev-app.ipa
